<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>미생물 핵심 듣기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--g:#2e7d32;--gl:#e8f5e9;--bg:#f6f8f6;--card:#fff;--ink:#1d2a1f;--sub:#5f6f62;--line:#e3e9e4;--red:#c62828}
@media (prefers-color-scheme: dark){:root{--g:#66bb6a;--gl:#1d3320;--bg:#111613;--card:#1a211c;--ink:#e6efe7;--sub:#9aab9d;--line:#2a352c;--red:#ef6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:19px;margin:6px 0 10px}
.player{background:#000;border-radius:18px;overflow:hidden;position:relative}
video{width:100%;display:block;max-height:40vh;background:#000}
.player.audio video{display:none}
.player.audio .ap{display:flex}
.ap{display:none;height:150px;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:linear-gradient(135deg,#2e7d32,#5e35b1);font-weight:800;gap:6px}
.ap small{opacity:.85;font-weight:600}
.now{margin:12px 2px 6px;font-weight:800;font-size:16px}
.now span{color:var(--g)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;background:var(--g);width:0}
.time{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin:4px 2px 10px}
.ctrl{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.ctrl button{border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:20px;padding:10px 0;flex:1;cursor:pointer;color:var(--ink)}
.ctrl .pp{background:var(--g);color:#fff;flex:1.4;font-size:22px;border:0}
.lbl{font-size:13px;color:var(--sub);font-weight:700;margin:12px 2px 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.list{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list button{display:flex;width:100%;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;text-align:left;font-size:14.5px;cursor:pointer;color:var(--ink)}
.list button:last-child{border:0}
.list button .tg{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--gl);color:var(--g);flex:none;min-width:52px;text-align:center}
.list button .tm{margin-left:auto;color:var(--sub);font-size:12px}
.list button.cur{background:var(--gl);box-shadow:inset 4px 0 0 var(--g)}
.list *{overflow-anchor:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:6px}
.list button.loop .tm:after{content:" 🔂"}
.bigbtn{position:absolute;right:10px;bottom:10px;z-index:3;border:0;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:14px;padding:8px 12px;cursor:pointer}
.player.audio .bigbtn{display:none}
.bigbar{display:none}
body.big{overflow:hidden}
body.big .top{position:fixed;inset:0;z-index:50;background:#000;padding:0 0 calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
body.big .player{flex:1;min-height:0;border-radius:0}
body.big video{max-height:none;height:100%;width:100%;object-fit:contain}
body.big .bigbtn{display:none}
body.big .now{color:#fff;margin:8px 14px 4px;font-size:15px}
body.big .now span{color:#a5d6a7}
body.big .prog{margin:0 14px;background:#333}
body.big .time{color:#bbb;margin:4px 16px 6px}
body.big .ctrl{margin:0 12px 8px}
body.big .ctrl button{background:#1d1d1d;border-color:#333;color:#fff}
body.big .ctrl .pp{background:var(--g)}
body.big .bigbar{display:flex;gap:8px;margin:0 12px}
.bigbar button{flex:1;border:1px solid #333;background:#1d1d1d;color:#fff;border-radius:12px;padding:10px 4px;font-weight:800;font-size:14px;cursor:pointer}
.bigbar .x{flex:.7;background:#c62828;border-color:#c62828}
video{width:100%;display:block;max-height:52vh;background:#000}
.tip{font-size:12.5px;color:var(--sub);margin-top:14px;line-height:1.6}
</style></head>
<body><main>
<h1>🎧 미생물 요약 카드 듣기</h1>
<div class="top">
<div class="player" id="pl">
  <video id="v" src="video.mp4?v=3" playsinline preload="metadata"></video>
  <button class="bigbtn" id="bigOn">⛶ 크게 보기</button>
  <div class="ap">🎧 음성만 재생 중<small>화면을 꺼도 들을 수 있어요</small></div>
</div>
<div class="now" id="now">▶ 재생을 눌러 시작하세요</div>
<div class="prog" id="pg"><i id="pgi"></i></div>
<div class="time"><span id="tc">0:00</span><span id="td">8:09</span></div>
<div class="ctrl">
  <button id="prev" aria-label="이전 항목">⏮</button>
  <button id="back" aria-label="5초 뒤로">↺5</button>
  <button id="pp" class="pp" aria-label="재생">▶</button>
  <button id="fwd" aria-label="5초 앞으로">5↻</button>
  <button id="next" aria-label="다음 항목">⏭</button>
</div>
<div class="bigbar"><button id="bRate">⚡ 1x</button><button id="bLoop">🔁 전체</button><button class="x" id="bigOff">✕ 작게</button></div>
</div>
<div class="lbl">⚡ 속도</div>
<div class="seg" id="sp"></div>
<div class="lbl">🔁 반복</div>
<div class="seg" id="lp">
  <button data-l="off">반복 끄기</button><button data-l="all">전체 반복</button><button data-l="one">이 항목만 🔂</button>
</div>
<div class="lbl">🖥 화면</div>
<div class="seg" id="md"><button data-m="video" class="on">영상</button><button data-m="audio">음성만 (화면 꺼도 OK)</button></div>
<div class="list" id="list"></div>
<p class="tip">💡 목록에서 항목을 누르면 그 부분부터 재생돼요. "이 항목만"을 켜면 헷갈리는 항목만 계속 반복해요. 영상을 누르거나 "⛶ 크게 보기"를 누르면 화면 가득 크게 보여요. 설정은 자동 저장돼요.</p>
</main>
<script>
const CH=[{"t": 0, "e": 10.03, "tag": "시작", "title": "인트로"}, {"t": 10.03, "e": 19.03, "tag": "찐핵심 1", "title": "pv. 와 f. sp."}, {"t": 19.03, "e": 30.26, "tag": "찐핵심 2", "title": "난균류"}, {"t": 30.26, "e": 41.76, "tag": "찐핵심 3", "title": "세포벽"}, {"t": 41.76, "e": 52.8, "tag": "찐핵심 4", "title": "DNA 바코드"}, {"t": 52.8, "e": 65.83, "tag": "찐핵심 5", "title": "시퀀싱 3세대"}, {"t": 65.83, "e": 78.83, "tag": "찐핵심 6", "title": "품질 지표"}, {"t": 78.83, "e": 91.38, "tag": "찐핵심 7", "title": "FASTQ 와 GFF"}, {"t": 91.38, "e": 104.1, "tag": "찐핵심 8", "title": "E-value 와 상동성"}, {"t": 104.1, "e": 115.6, "tag": "찐핵심 9", "title": "Ortholog 와 Paralog"}, {"t": 115.6, "e": 124.1, "tag": "찐핵심 10", "title": "N50 과 L50"}, {"t": 124.1, "e": 133.1, "tag": "찐핵심 11", "title": "Gene Ontology"}, {"t": 133.1, "e": 141.1, "tag": "찐핵심 12", "title": "시작 신호"}, {"t": 141.1, "e": 154.25, "tag": "찐핵심 13", "title": "1차 DB 와 2차 DB"}, {"t": 154.25, "e": 166.25, "tag": "찐핵심 14", "title": "TPM 과 반복"}, {"t": 166.25, "e": 181.75, "tag": "찐핵심 15", "title": "FAIR 와 FDR"}, {"t": 181.75, "e": 198.75, "tag": "1주차", "title": "균주 와 분리주"}, {"t": 198.75, "e": 215.98, "tag": "1주차", "title": "진화 순서와 세포내공생"}, {"t": 215.98, "e": 233.98, "tag": "1주차", "title": "배양과 종 기준"}, {"t": 233.98, "e": 245.98, "tag": "2주차", "title": "디지털 전환 3단계"}, {"t": 245.98, "e": 265.54, "tag": "2주차", "title": "Phred 와 HGP"}, {"t": 265.54, "e": 280.04, "tag": "2주차", "title": "빅데이터"}, {"t": 280.04, "e": 292.54, "tag": "3주차", "title": "FASTA 와 Trimming"}, {"t": 292.54, "e": 307.66, "tag": "3주차", "title": "GFF 와 GenBank"}, {"t": 307.66, "e": 328.66, "tag": "3주차", "title": "메타데이터 표준"}, {"t": 328.66, "e": 345.22, "tag": "4주차", "title": "BLAST"}, {"t": 345.22, "e": 356.22, "tag": "4주차", "title": "조립 방식"}, {"t": 356.22, "e": 373.24, "tag": "4주차", "title": "변이"}, {"t": 373.24, "e": 385.74, "tag": "5주차", "title": "ORF"}, {"t": 385.74, "e": 396.74, "tag": "5주차", "title": "원핵 vs 진핵"}, {"t": 396.74, "e": 411.24, "tag": "5주차", "title": "예측 전략과 도구"}, {"t": 411.24, "e": 421.24, "tag": "6주차", "title": "Swiss-Prot 과 TrEMBL"}, {"t": 421.24, "e": 435.24, "tag": "6주차", "title": "병원체 DB"}, {"t": 435.24, "e": 447.89, "tag": "6주차", "title": "워크플로 도구"}, {"t": 447.89, "e": 461.98, "tag": "7주차", "title": "실험 설계"}, {"t": 461.98, "e": 474.48, "tag": "7주차", "title": "정규화"}, {"t": 474.48, "e": 491.98, "tag": "7주차", "title": "차등 발현"}, {"t": 491.98, "e": 502.98, "tag": "끝", "title": "마무리"}];
const v=document.getElementById('v'), pl=document.getElementById('pl');
let S={rate:1,loop:'all',mode:'video'}; try{Object.assign(S,JSON.parse(localStorage.getItem('ml_set')||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem('ml_set',JSON.stringify(S));}catch(e){}};
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const cur=()=>{const t=v.currentTime;let i=0;for(let k=0;k<CH.length;k++){if(t>=CH[k].t-0.05)i=k;}return i;};
let lockIdx=null;
// speed
const RATES=[0.75,1,1.25,1.5,1.75,2];
const sp=document.getElementById('sp');
sp.innerHTML=RATES.map(r=>'<button data-r="'+r+'">'+r+'x</button>').join('');
function setRate(r){S.rate=r;v.playbackRate=r;v.defaultPlaybackRate=r;sp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.r===r));save();}
sp.onclick=e=>{const b=e.target.closest('button');if(b)setRate(+b.dataset.r);};
// loop
const lp=document.getElementById('lp');
function setLoop(l){S.loop=l;lockIdx=l==='one'?cur():null;lp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));paint();save();}
lp.onclick=e=>{const b=e.target.closest('button');if(b)setLoop(b.dataset.l);};
// mode
const md=document.getElementById('md');
function setMode(m,keep){const t=v.currentTime,playing=!v.paused;S.mode=m;pl.classList.toggle('audio',m==='audio');md.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const src=m==='audio'?'audio.m4a?v=3':'video.mp4?v=3'; if(!v.src.endsWith(src)){v.src=src;v.addEventListener('loadedmetadata',function f(){v.currentTime=t;v.playbackRate=S.rate;if(playing)v.play();v.removeEventListener('loadedmetadata',f);});}
  save();}
md.onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};
// list
const list=document.getElementById('list');
list.innerHTML=CH.map((c,i)=>'<button data-i="'+i+'"><span class="tg">'+c.tag+'</span><span>'+c.title+'</span><span class="tm">'+fmt(c.t)+'</span></button>').join('');
list.onclick=e=>{const b=e.target.closest('button');if(!b)return;go(+b.dataset.i);};
function go(i){i=Math.max(0,Math.min(CH.length-1,i));v.currentTime=CH[i].t+0.01;if(S.loop==='one')lockIdx=i;v.play();paint();}
let last=-1;
function paint(){const i=cur();const c=CH[i];document.getElementById('now').innerHTML='<span>'+c.tag+'</span> · '+c.title+(S.loop==='one'?' 🔂':'');
  if(i!==last||true){list.querySelectorAll('button').forEach((b,k)=>{b.classList.toggle('cur',k===i);b.classList.toggle('loop',S.loop==='one'&&k===lockIdx);});
   if(i!==last){last=i;}}
  document.getElementById('tc').textContent=fmt(v.currentTime);
  if(v.duration)document.getElementById('pgi').style.width=(v.currentTime/v.duration*100)+'%';}
v.addEventListener('loadedmetadata',()=>{document.getElementById('td').textContent=fmt(v.duration);v.playbackRate=S.rate;});
v.addEventListener('timeupdate',()=>{
  if(S.loop==='one'&&lockIdx!=null){const c=CH[lockIdx];if(v.currentTime>=c.e-0.15||v.currentTime<c.t-0.5){v.currentTime=c.t+0.01;}}
  paint();});
v.addEventListener('ended',()=>{if(S.loop==='all'){v.currentTime=0;v.play();}else if(S.loop==='one'&&lockIdx!=null){v.currentTime=CH[lockIdx].t;v.play();}});
v.addEventListener('play',()=>{document.getElementById('pp').textContent='⏸';v.playbackRate=S.rate;});
v.addEventListener('pause',()=>{document.getElementById('pp').textContent='▶';});
document.getElementById('pp').onclick=()=>v.paused?v.play():v.pause();
document.getElementById('back').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-5);};
document.getElementById('fwd').onclick=()=>{v.currentTime=Math.min(v.duration||0,v.currentTime+5);};
document.getElementById('prev').onclick=()=>{const i=cur();go(v.currentTime-CH[i].t>2?i:i-1);};
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('pg').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(v.duration)v.currentTime=(e.clientX-r.left)/r.width*v.duration;};
if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'미생물 요약 카드 듣기',artist:'D-1'});
  navigator.mediaSession.setActionHandler('previoustrack',()=>document.getElementById('prev').click());
  navigator.mediaSession.setActionHandler('nexttrack',()=>document.getElementById('next').click());}

// big screen
const LN={off:'반복 끔',all:'🔁 전체',one:'🔂 이 항목'};
function bigPaint(){document.getElementById('bRate').textContent='⚡ '+S.rate+'x';document.getElementById('bLoop').textContent=LN[S.loop];}
function big(on){document.body.classList.toggle('big',on);if(on){try{history.pushState({big:1},'');}catch(e){}window.scrollTo(0,0);}bigPaint();}
document.getElementById('bigOn').onclick=e=>{e.stopPropagation();big(true);};
document.getElementById('bigOff').onclick=()=>{if(history.state&&history.state.big)history.back();else big(false);};
window.addEventListener('popstate',()=>{if(document.body.classList.contains('big'))big(false);});
v.addEventListener('click',()=>{if(!document.body.classList.contains('big'))big(true);else v.paused?v.play():v.pause();});
document.getElementById('bRate').onclick=()=>{const i=RATES.indexOf(S.rate);setRate(RATES[(i+1)%RATES.length]);bigPaint();};
document.getElementById('bLoop').onclick=()=>{const o=['off','all','one'];setLoop(o[(o.indexOf(S.loop)+1)%3]);bigPaint();};
sp.addEventListener('click',bigPaint);lp.addEventListener('click',bigPaint);
setRate(S.rate); setLoop(S.loop==='one'?'all':S.loop); if(S.mode==='audio')setMode('audio'); paint();
</script>
</body></html>
